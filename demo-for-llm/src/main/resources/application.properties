############################################################
# Application
############################################################
spring.application.name=demo-for-llm
############################################################
# Async & Server Timeouts (Increased to 5 minutes for LLMs)
############################################################
# Spring MVC Async timeout for Mono/Flux endpoints
spring.mvc.async.request-timeout=600000

# Tomcat server connection timeout
server.tomcat.connection-timeout=300000

# Optional: Add specific Spring AI timeout properties if using RestClient
spring.ai.retry.max-attempts=1
spring.ai.retry.on-client-errors=false

############################################################
# Gemini
############################################################
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY:}

spring.ai.google.genai.chat.options.model=gemini-2.5-flash
spring.ai.google.genai.embedding.text.options.model=gemini-embedding-2

############################################################
# Fast Tier (GitHub Models / Azure OpenAI)
############################################################
spring.ai.openai.api-key=${LLM_API_KEY}
spring.ai.openai.base-url=${LLM_BASE_URL:https://models.inference.ai.azure.com}

spring.ai.openai.chat.options.model=${LLM_MODEL:Phi-4-mini-instruct}
spring.ai.openai.chat.options.temperature=0.1

############################################################
# Backward compatibility
############################################################
llm.fast_tier.api.key=${LLM_API_KEY}

############################################################
# Spring Actuator
############################################################
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.health.defaults.enabled=true

############################################################
# File Upload
############################################################
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

############################################################
# Web Scraper
############################################################
web.scraper.timeout=10000
web.scraper.userAgent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36

############################################################
# Redis
############################################################
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=

semantic.cache.similarity.threshold=0.95

############################################################
# Token Budget Manager
############################################################
token.budget.total=120000
token.budget.system-reserve=10000
token.budget.history-reserve=25000
token.budget.rag-reserve=50000
token.budget.user-reserve=5000
token.budget.response-reserve=30000
token.budget.default-rag-top-k=5
token.budget.min-rag-top-k=1
token.budget.rag-top-k-simple=2
token.budget.rag-top-k-medium=5
token.budget.rag-top-k-complex=10
token.budget.rag-top-k-very-complex=20
token.budget.enabled=true

############################################################
# Conversation Auto-Summarization
############################################################
conversation.summarization.threshold=200

#debug=true

############################################################
# Database (H2 for Observability Metrics)
############################################################
spring.datasource.url=jdbc:h2:file:./data/observability;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

############################################################
# Logging
############################################################
logging.level.root=INFO
logging.level.com.example.demo=INFO
# Uncomment the next line for detailed debug traces (embeddings, cache misses, token chunking, etc.)
# logging.level.com.example.demo=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n